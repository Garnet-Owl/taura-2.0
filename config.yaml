paths:
  # Root directory scanned recursively for *.csv parallel data files.
  # Add a new sub-folder here to register a new data source — no code change needed.
  parallel_data_dir: data/parallel

  # Seeded 80/10/10 train/val/test split built by scripts/prepare_dataset.py
  splits_dir: data/splits

  # Root directory where training run sub-folders are created
  models_dir: models

  # Optional fine-tuned Marian models exported to CTranslate2 int8, one sub-folder
  # per direction (ki_en, en_ki). Auto-downloaded from Hugging Face on server
  # startup (app.shared.model_sync); never committed. Enables the 'neural' method.
  neural_model_dir: models/marian-ct2-int8

  # FastText + Procrustes models, auto-downloaded from Hugging Face on server
  # startup. Always the single deployed copy (no run_* versioning); never
  # committed. Enables the 'retrieval' and 'word-by-word' methods.
  fasttext_deploy_dir: models/fasttext-deployed

  # Directory where accumulated monolingual text lives (append-only, not used by training directly)
  monolingual_dir: data/monolingual

  # Seed dictionary CSV with columns "Kikuyu" and "English"
  seed_dictionary: data/processed/seed_dictionary.csv

  # Translation feedback log
  feedback_file: data/feedback.jsonl

# Active parallel data sources (sub-folders of parallel_data_dir).
# Document only — the loader scans all CSVs recursively.
data_sources:
  bible: data/parallel          # Matthew, Mark, Luke, John, Acts, Romans, 1-2 Corinthians
  agriculture: data/parallel/agriculture  # Coffee, Dairy, Poultry, Potato, Banana, Mango, Cabbage, Avocado

training:
  embedding_dim: 300
  fasttext_model_type: skipgram
  fasttext_epoch: 50
  fasttext_lr: 0.1
  fasttext_ws: 8
  fasttext_min_count: 2
  # Using default FastText n-gram range (3-6) for both languages.
  # Experiments showed that using 2-7 degraded alignment performance significantly.
  fasttext_minn: 3
  fasttext_maxn: 6
  alignment_refinement_iters: 5

datasets:
  repo_cgiar: CGIAR/KikuyuEnglish_translation
  repo_mich: michsethowusu/english-kikuyu_sentence-pairs

# Hugging Face repo serving the deployed Marian and FastText models.
# app.shared.model_sync checks this repo's latest commit SHA on every server
# startup and re-downloads only when it differs from the locally cached one.
models:
  hf_repo: Garnet-Owl/taura-marian-kikuyu-english
